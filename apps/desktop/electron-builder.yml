# 第一刀（docs/desktop-packaging-plan.md §5.1）：不签名不公证，
# 故 hardenedRuntime / entitlements / notarize 与 win/nsis/publish 段先删；
# 完整签名 + 公证 + 更新通道的骨架见该文档 §3.1，第二刀起启用。
appId: cn.shadowroom.producer-tools
productName: ShadowRoom
directories: { output: release }
files: [ "main.mjs", "home.mjs", "package.json" ]
extraResources:
  - from: ../web/dist                   # vite 产物随包（app:// 伺服根）
    to: web-dist
  - from: ../../tools                   # 两个桥
    to: tools
  # 9 个插件仓源码（第二刀第 1 步：打包态每次启动同步进 HOME/<repo>，桥按老约定找 mcp_server.py）。
  # filter 排除 .git 与字节码缓存；体积共 ~4.2MB（实测）。
  - from: ../../../shadow-music-generator
    to: plugins/shadow-music-generator
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../audio-analysis-dedupe
    to: plugins/audio-analysis-dedupe
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../rekordbox-serato-bridge
    to: plugins/rekordbox-serato-bridge
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../set-planner
    to: plugins/set-planner
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../stem-splitter
    to: plugins/stem-splitter
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../soundfont-renderer
    to: plugins/soundfont-renderer
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../steward
    to: plugins/steward
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../library
    to: plugins/library
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
  - from: ../../../ShadowMusicGrabber
    to: plugins/ShadowMusicGrabber
    filter: ["**/*", "!**/.git/**", "!**/__pycache__/**", "!**/*.pyc"]
mac:
  target: [{ target: dmg }, { target: zip }]
  category: public.app-category.music
  extendInfo:
    # 双击首启读 ~/Documents/ShadowRoom 会触发 TCC「文件与文件夹」弹窗（第一刀插件仍住在
    # 文稿文件夹；实测 2026-09-25：终端继承授权不弹、launchd 起则 python 阻塞在 open()
    # 等用户决定）。这段文案就显示在那张弹窗上；第二刀插件随包走后此键删。
    NSDocumentsFolderUsageDescription: ShadowRoom 需要访问「文稿」文件夹以读取插件与曲库（第一刀：插件仍安装在 ~/Documents/ShadowRoom）。
